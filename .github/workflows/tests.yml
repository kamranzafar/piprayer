name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Raspberry Pi OS ships 3.9 (Bullseye), 3.11 (Bookworm) and 3.13 (Trixie)
        python-version: ["3.11", "3.13", "3.14"]
        os: [ubuntu-latest]
        include:
          # Python 3.9 builds are not available for the newest Ubuntu
          - python-version: "3.9"
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pytest -v

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck play-azaan.sh setup-piprayer.sh
